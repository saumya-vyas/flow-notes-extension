<!DOCTYPE html><html><head><meta charset="utf-8"><title>shot 1</title>
<link rel="stylesheet" href="stage.css"></head>
<body class="stage">
  <div class="brand"><img src="mark.svg" alt="">Flow Notes</div>
  <div class="copy">
    <div class="eyebrow">Capture</div>
    <h1>Highlight a passage. <mark>Keep reading.</mark></h1>
    <p class="sub">A small popup appears right where you are. Pick a note, save,
    and carry on &mdash; no tab switching, no copy and paste.</p>
  </div>
  <div class="visual">
    <div class="window">
      <div class="bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url">blog.example.com/http-caching</div>
        <span class="tb-icon"><img src="mark.svg" alt=""></span>
      </div>
      <iframe src="article.html" width="640" height="580"></iframe>
    </div>
  </div>
</body></html>
