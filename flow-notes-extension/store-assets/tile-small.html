<!DOCTYPE html><html><head><meta charset="utf-8"><title>small tile</title>
<link rel="stylesheet" href="stage.css">
<style>
  /* Paper ground, not ink: on an ink ground the mark's own ink tile vanishes
     and only the ribbon and band are left floating. */
  body.stage{width:440px;height:280px;display:flex;flex-direction:column;justify-content:center;padding:0 38px 0 64px}
  body.stage::before{left:34px}
  .row{display:flex;align-items:center;gap:16px}
  .row img{width:64px;height:64px}
  .name{font:600 36px/1 var(--serif);letter-spacing:-.01em}
  .tag{margin-top:24px;font:500 20px/1.4 var(--sans);color:var(--ink-soft)}
  .tag mark{background:linear-gradient(transparent 58%,var(--yel) 58% 94%,transparent 94%);color:var(--ink);padding:0 2px}
</style></head>
<body class="stage">
  <div class="row"><img src="mark.svg" alt=""><div class="name">Flow Notes</div></div>
  <div class="tag">Highlights into <mark>notes you own.</mark><br>Organised by AI, when you ask.</div>
</body></html>
