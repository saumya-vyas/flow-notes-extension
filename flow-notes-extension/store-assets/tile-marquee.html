<!DOCTYPE html><html><head><meta charset="utf-8"><title>marquee</title>
<link rel="stylesheet" href="stage.css">
<style>
  body.stage{width:1400px;height:560px}
  .copy{left:120px;width:620px}
  .brand{left:120px;top:48px}
  h1{font-size:50px}
  .visual{left:800px;right:70px;align-items:flex-start;padding-top:70px}
  .chrome{width:470px;position:relative}
  .chrome .bar{border-radius:12px;border:1px solid #DCD4C2}
  .pop{position:absolute;right:0;top:54px;border-radius:10px;overflow:hidden;
    box-shadow:0 34px 70px -24px rgba(47,42,33,.45),0 0 0 1px rgba(47,42,33,.14)}
</style><script>
  // In <head>, so it exists before the popup iframe can post its height.
  addEventListener("message", (e) => {
    const frame = document.getElementById("pf");
    if (frame && e.data && e.data.h) frame.height = e.data.h;
  });
</script>
</head>
<body class="stage">
  <div class="brand"><img src="mark.svg" alt="">Flow Notes</div>
  <div class="copy" style="top:60px">
    <h1>Highlight while you read. <mark>Make sense of it later.</mark></h1>
    <p class="sub">Captures go straight into your own Google Docs, Apple Notes or
    Markdown files. Organise or Summarise them with AI whenever you choose.</p>
  </div>
  <div class="visual">
    <div class="chrome">
      <div class="bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url">blog.example.com/http-caching</div>
        <span class="tb-icon active"><img src="mark.svg" alt=""></span>
      </div>
      <div class="pop"><iframe id="pf" src="build/popup-demo.html" width="340" height="420"></iframe></div>
    </div>
  </div>
</body></html>
